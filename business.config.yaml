# ============================================================================
# business.config.yaml — Amir Precision Cuts
#
# THE SINGLE INPUT. The brand voice, banned-word list, internal-link map,
# byline, topic queue, brand assets and the site itself all derive from this.
#
# PROVENANCE — every value is either supplied by the client, verified, or an
# explicitly-flagged assumption. Nothing here is invented quietly.
#   SUPPLIED : name/domain, phone, Instagram, email, street address, hours,
#              services and prices
#   VERIFIED : city + region + postcode (that block of Ventura Blvd is Encino,
#              CA 91316), timezone, and every entry in location_anchors
#   ASSUMED  : booking.model, brand palette/fonts/layout, and all prose.
#              Flagged individually below.
#   OMITTED  : years_experience — not supplied, and inventing a number about
#              someone's career is not something a config should do. The hero
#              stat, about list, author bio and eeat topics all adapt.
# ============================================================================

