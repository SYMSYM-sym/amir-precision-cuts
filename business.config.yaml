hours:
  # SUPPLIED. Saturday closes an hour earlier, which is exactly the case a
  # single opens/closes pair cannot express — per_day carries it rather than
  # rounding Saturday up to 8pm and telling someone the door is open when it
  # is not.
  days: ["Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"]
  opens: "09:00"
  closes: "20:00"
  per_day:
    Tuesday: { opens: "09:00", closes: "20:00" }
    Wednesday: { opens: "09:00", closes: "20:00" }
    Thursday: { opens: "09:00", closes: "20:00" }
    Friday: { opens: "09:00", closes: "20:00" }
    Saturday: { opens: "09:00", closes: "19:00" }
  notes: "Closed Sunday and Monday."

booking:
  # ASSUMED: appointment-only. No booking system was supplied, and this is the
  # conservative reading — "walk-ins welcome" would be a promise about
  # availability the site makes on Amir's behalf. Calling is the CTA.
  model: "appointment-only"
  url: ""
  publish_phone: true
  phone: "+18188183945"
  publish_email: true
  email: "amirarsang86@gmail.com"
  lead_time_note: "Saturdays fill first. A day or two ahead is usually enough midweek."
  social:
    instagram: "https://www.instagram.com/amirprecisioncuts"

homepage:
  about_body: >-
    Amir Precision Cuts is a barbershop on Ventura Boulevard, a short walk from
    the Encino Oak Tree. The work is the kind that only shows up in the details
    — a neckline that still looks deliberate three weeks later, a beard shaped
    to the face rather than to a template, a hot towel shave taken at the pace
    it needs. Every appointment is with Amir, and the chair is not
    double-booked.
  aftercare_body: >-
    Leave a fresh cut alone for the first day — no product, and no cap pulled
    down hard over the shape. After that, wash with something that does not
    strip the scalp and towel dry rather than rubbing. A beard holds its shape
    far longer if you comb it out after every wash and oil it while the skin is
    still slightly damp. After a hot towel shave, skip anything with alcohol in
    it for a day. Most cuts here sit right for three to four weeks; come back
    when the neckline starts to blur rather than when the length starts to
    bother you, and the shape never has to be rebuilt from scratch.
  faq:
    - q: "Do I need an appointment?"
      a: "Yes — the shop runs by appointment so the chair is not double-booked. Call or message on Instagram and we will find you a slot."
    - q: "How much is a haircut?"
      a: "A haircut is $50. A haircut with a beard trim is $70, and a scissor cut with a beard trim is $90. The full list is on this page."
    - q: "How long does an appointment take?"
      a: "About 45 minutes for a haircut, and closer to an hour and a quarter if the beard is being done as well. A hot towel shave is its own appointment."
    - q: "What is the signature haircut with the black mask?"
      a: "A haircut finished with a charcoal mask over the face and neck. It lifts the skin before the detail work and leaves the edges looking cleaner. It runs $100 and takes longer than a standard cut, so mention it when you book."
    - q: "Do you do beard trims on their own?"
      a: "Yes, $40 on its own. If you are coming in for a cut anyway, the combined service works out cheaper."
    - q: "How often should I come back?"
      a: "Three to four weeks for most cuts. Sooner if you wear it short at the back, since that is where regrowth shows first."
    - q: "Which days are you open?"
      a: "Tuesday to Friday, 9 to 8, and Saturday 9 to 7. Closed Sunday and Monday."
    - q: "Where do I park?"
      a: "Street parking along Ventura Boulevard, metered nearest the shop. Saturdays are busier, so leave a few extra minutes."

services:
  # SUPPLIED prices, exactly as given, with no "+" suffix — these are the
  # prices rather than starting points. The validator rejects any article that
  # states a number not on this list.
  - key: "haircut"
    label: "Haircut"
    price_from: "$50"
    duration: "45 min"
    description: "A cut shaped to how your hair actually grows, finished with a clean neckline and edges."
  - key: "haircut-beard-trim"
    label: "Haircut and Beard Trim"
    price_from: "$70"
    duration: "1 hr 15 min"
    description: "The full reset — cut and beard in one sitting, with the two lines shaped to work together."
  - key: "beard-trim"
    label: "Beard Trim"
    price_from: "$40"
    duration: "30 min"
    description: "Shaped to the jaw and cheek rather than to a template, with the neckline taken down clean."
  - key: "signature-haircut-black-mask"
    label: "Signature Haircut with Black Mask"
    price_from: "$100"
    duration: "1 hr 30 min"
    description: "A haircut finished with a charcoal mask over the face and neck. Lifts the skin before the detail work and leaves the edges sharper."
  - key: "hot-towel-shave"
    label: "Hot Towel Shave"
    price_from: "$60"
    duration: "45 min"
    description: "A traditional straight razor shave, taken at the pace it needs, with hot towels either side."
  - key: "scissor-cut-beard-trim"
    label: "Scissor Cut and Beard Trim"
    price_from: "$90"
    duration: "1 hr 30 min"
    description: "Scissor work over the whole head for length and movement, with the beard shaped to match."

brand:
  # ASSUMED. A barbershop with a $100 signature service reads dark and
  # traditional rather than bright and modern. The classic layout variant is
  # symmetric and serif-forward, and its dotted-leader service list is what a
  # barbershop price board already looks like.
  voice_adjectives: ["plain-spoken", "exacting", "unhurried", "confident"]
  audience: "Men in Encino and the surrounding Valley who would rather pay once for a cut that holds its shape than three times for one that does not."
  banned_extra:
    - "fresh cut fade life"
    - "grooming journey"
    - "snatched"
    - "elevate your look"
  palette:
    bg: "#121212"
    surface: "#1b1b1b"
    accent: "#c9a227"
    text: "#f5f2ec"
    muted: "#a8a29a"
  fonts:
    display: "Playfair Display"
    body: "Work Sans"
  layout_variant: "classic"
  feel: "measured, traditional, quietly expensive; the tone of someone who does not need to sell you the upgrade"

site:
  domain: "amirprecisioncuts.com"
  blog_path: "/blog"
  blog_title: "From the Chair"
  blog_subtitle: "Notes on cuts, beards and shaves, written on Ventura Boulevard in Encino."

content:
  cadence_days: ["Tuesday", "Friday"]
  publish_hour_local: "09:00"
  articles_per_day_max: 1
  publish_mode: "instant"
  word_count: { min: 850, max: 1500, target_min: 900, target_max: 1350 }
  originality_max_similarity: 0.85
  queue_dedupe_max_similarity: 0.80
  internal_links: { min: 2, max: 4 }
  location_mentions_min: 3
  faq_questions: 4
  buckets:
    - "hyperlocal"
    - "service-detail"
    - "comparison"
    - "question"
    - "aftercare"
    - "pricing"
    - "first-timer"
    - "eeat"
  topics_to_seed: 50
  limits:
    max_topics_per_run: 3
    max_regen_per_topic: 2
    max_api_calls_per_run: 5
    max_derive_api_calls: 4

compliance:
  no_medical_claims: true
  no_guarantees: true
  no_superlatives_without_evidence: true
  no_invented_prices: true
  extra_notes: "California requires a barber licence for haircutting and shaving. Never imply dermatological or medical benefit from the charcoal mask or from any product, and never claim results for hair growth or skin conditions."

integrations:
  anthropic_model: "claude-sonnet-4-5-20250929"
  vercel_project: "amir-precision-cuts"
  github_repo: ""
  sentry_dsn: ""
  analytics: ""
