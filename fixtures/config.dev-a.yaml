homepage:
  about_body: >-
    Ledgerwood is two chairs on the second floor of a Wickenden Street walk-up.
    Tova has been mapping lash lines for fourteen years and still does every set
    herself. Appointments run long on purpose — a full set takes two hours and
    the last twenty minutes are for checking the work in daylight.
  aftercare_body: >-
    Keep the set dry for the first twenty-four hours: no steam, no swimming, no
    hot yoga. After that, wash them daily with a lash-safe foaming cleanser and
    a soft brush — clean lashes hold retention far longer than dry ones. Sleep
    on your back or side if you can, skip oil-based removers entirely, and never
    pick at a lash that feels loose. Come back every two to three weeks.
  faq:
    - q: "How long does a full set take?"
      a: "Two hours for a classic set, closer to two and a half for volume. We book the room for the full window so nobody is rushed."
    - q: "Will extensions damage my natural lashes?"
      a: "Not when they are mapped and weighted correctly. Damage comes from extensions that are too long or too heavy for the natural lash carrying them, which is why we map every set to your own lash line rather than to a picture."
    - q: "How often do I need a fill?"
      a: "Every two to three weeks for most people. Past four weeks a fill becomes a new set, and we price it as one."
    - q: "Can I wear mascara?"
      a: "On a classic set, a lash-safe water-based mascara on the tips only. On volume, no — it collapses the fans and takes the set with it when you remove it."
    - q: "I have sensitive eyes. Is there an option?"
      a: "Yes. We keep a low-fume adhesive for reactive clients. Tell us when you book so we can patch test at least forty-eight hours ahead."
    - q: "What if I do not like them?"
      a: "Say so in the chair. Adjusting curl or length while you are still here costs nothing. Removal within seven days is free."
    - q: "Do you do brows as well?"
      a: "Lamination, tint, and shaping. Brows are a separate appointment — we do not stack them behind a full set."

services:
  - key: "classic-set"
    label: "Classic Full Set"
    price_from: "$180"
    duration: "2 hr"
    description: "One extension per natural lash, mapped to your own lash line. The set people do not notice you are wearing."
  - key: "volume-set"
    label: "Volume Full Set"
    price_from: "$225"
    duration: "2 hr 30 min"
    description: "Hand-made fans for density without weight. Built lighter than it looks."
  - key: "fill"
    label: "Fill"
    price_from: "$85"
    duration: "75 min"
    description: "Replaces grown-out extensions and rebalances the map. Book within three weeks of your last visit."
  - key: "lash-removal"
    label: "Removal"
    price_from: "$40"
    duration: "30 min"
    description: "Gel-based removal that leaves the natural lash intact. Free within seven days of a set we placed."
  - key: "brow-lamination"
    label: "Brow Lamination"
    price_from: "$95"
    duration: "60 min"
    description: "Restructures the brow hair to sit where it grows best, then shapes to it. Lasts six to eight weeks."
  - key: "brow-tint"
    label: "Brow Tint and Shape"
    price_from: "$65"
    duration: "45 min"
    description: "Colour matched half a shade under your hair, then shaped with wax and tweezers."

