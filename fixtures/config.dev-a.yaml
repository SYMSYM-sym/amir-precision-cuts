# ============================================================================
# DEV FIXTURE A — NOT a real business, NOT the shipping config.
#
# This exists so the factory is exercised against TWO businesses from the first
# commit onward. The kit puts the swap test at Phase 11; that is the phase an
# experienced builder skips because "it would obviously work." Rendering both
# fixtures on every derive turns the swap test into a smoke test: a weld I fail
# to cut shows up as a diff against itself in minutes, not in three sessions.
#
# Deliberately maximally UNLIKE fixture B: different vertical, schema type,
# region, timezone, palette temperature, font pairing, layout_variant, cadence,
# booking model, and contact policy.
# ============================================================================

