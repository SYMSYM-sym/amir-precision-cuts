homepage:
  about_body: >-
    Sweetwater is a six-table lounge on Vista Avenue with south-facing windows,
    which is the whole reason Marisol signed the lease. Colour reads true in
    daylight and so do cuticles. We took the walk-in model on purpose — most
    people decide they want their nails done about forty minutes before they
    want them done.
  aftercare_body: >-
    Give a fresh gel set twelve hours before anything abrasive: no scrubbing
    pans, no gardening gloves, no picking at a lifted edge. Oil the cuticle
    nightly — it is the single thing that separates a set that lasts three weeks
    from one that lifts in eight days. Wear gloves for dishes and cleaning
    products. If a corner lifts, come in and let us seal it; water under a gel
    edge is how a small lift becomes a full removal.
  faq:
    - q: "Do I need an appointment?"
      a: "No. We are walk-in first and hold most of the day open for it. If you want a specific tech or a long set, email ahead and we will pencil you in."
    - q: "How long does a gel manicure last?"
      a: "Two to three weeks on most people before regrowth shows. Nail growth rate does more of the work here than the product does."
    - q: "Do you do acrylics?"
      a: "No. We are a natural-nail lounge — gel, builder gel, and polish. If you want a full acrylic set we will happily point you to someone across town who does them well."
    - q: "Can you take off a set I got somewhere else?"
      a: "Yes. Soak-off removal is priced on its own and we will tell you honestly what the nail underneath looks like before we put anything new on it."
    - q: "Is builder gel the same as acrylic?"
      a: "No. Builder gel adds strength over your own nail without a tip or an extension. It files off softer and is a lot kinder to a thin nail plate."
    - q: "What if a nail chips in the first week?"
      a: "Come back and we will fix that nail at no charge within seven days. It happens and it is usually our application, not you."
    - q: "Are your tools sanitised between clients?"
      a: "Everything metal is autoclaved. Files and buffers are single-use and go in the bin in front of you."
    - q: "Do you take kids?"
      a: "Yes, polish only, and they need an adult at the table."

