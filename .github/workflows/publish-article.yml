name: Publish Article

# Stops the GitHub schedule and the Vercel cron from generating at the same moment.
concurrency:
  group: publish-article
  cancel-in-progress: false

on:
  # GENERATED by `npm run derive --only=workflows` from content.cadence_days,
  # content.publish_hour_local and location.timezone. Do not hand-edit the crons:
  # the cadence lives in FOUR places (here, dashboard/vercel.json, the dashboard's
  # "next publish" display, and the heartbeat monitor) and hand-editing one of
  # them is bug A12.
  #
  # Two crons on purpose. GitHub crons are fixed UTC, so a single line drifts an
  # hour across DST and publishes at the wrong local time for half the year. Both
  # the standard-time and daylight-time UTC hours are emitted; whichever is not
  # currently correct is a no-op, because the once-per-day guard (R7) sees the
  # day already published and exits 0.
  #
  # A third reason for redundancy: GitHub's scheduler is best-effort and skips
  # runs under load. R23 -- never treat "the cron is configured" as evidence it
  # ran. The heartbeat is what actually proves it.
  schedule:
    - cron: '23 17 * * 2,5'   # 09:00 America/Los_Angeles, standard time
    - cron: '23 16 * * 2,5'   # 09:00 America/Los_Angeles, daylight time
  workflow_dispatch:
    inputs:
      slug:
        description: 'Optional: force a specific topic slug'
        required: false
        type: string

# R23 — TWO GitHub behaviours that make a schedule silently never fire:
#   1. A scheduled workflow only starts running once the workflow file has been
#      committed to the DEFAULT BRANCH. A schedule added on a feature branch
#      never fires and gives no warning.
#   2. GitHub DISABLES scheduled workflows after 60 days of repository
#      inactivity. A self-publishing blog commits constantly so it rarely trips,
#      but if publishing stalls for any other reason this turns a recoverable
#      outage into a permanent one.
# The heartbeat (R5) catches both. Never treat configuration as evidence of a run.

permissions:
  contents: write
  pull-requests: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # R7: at most ONE article in flight. If an auto-article PR is already open,
      # skip generation. FAIL-OPEN (no `set -e`, `|| echo 0`): a guard hiccup must
      # never STOP publishing — worst case we generate one extra.
      - name: Skip generation if an auto-article PR is already open
        id: guard
        if: github.event.inputs.slug == ''
        env:
          GH_TOKEN: $
        run: |
          set -uo pipefail
          n="$(gh pr list --state open --label auto-article --json number --jq 'length' 2>/dev/null || echo 0)"
          if [ "${n:-0}" -gt 0 ]; then
            echo "An auto-article PR is already open ($n). Skipping generation this run."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "No open auto-article PR; proceeding."
          fi

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.skip != 'true'
        with:
          node-version: '20'
          cache: npm

      - if: steps.guard.outputs.skip != 'true'
        run: npm ci

      # Runs the self-healing loop (R1): <=3 topics, <=3 regens, quarantine permanent
      # failures, never wedge. Missing API key hard-stops (R15).
      - name: Generate article
        if: steps.guard.outputs.skip != 'true'
        env:
          ANTHROPIC_API_KEY: $
          ANTHROPIC_MODEL: $
          FORCE_SLUG: $
        run: node scripts/index.mjs

      - name: Detect changes
        id: git_status
        if: steps.guard.outputs.skip != 'true'
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open PR
        id: cpr
        if: steps.guard.outputs.skip != 'true' && steps.git_status.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'blog: $'
          title: 'blog: $'
          body: |
            Auto-generated article. Publishes immediately once it passes validation.

            - Slug: $
            - Target keyword: $
            - Bucket: $
            - Word count: $
          branch: auto/article-$
          labels: auto-article

      # R12: instant publish. The validator already gated quality, so there's no wait.
      # FAIL-SOFT on purpose: if the merge can't complete (mergeability still computing,
      # transient API blip), warn and exit 0 — the hourly backstop publishes it within
      # the hour. A merge hiccup must delay, never block or redden the run.
      # R11: needs actions/checkout above for --delete-branch.
      - name: Publish immediately (merge the new PR)
        if: steps.cpr.outputs.pull-request-number
        env:
          GH_TOKEN: $
        run: |
          set -uo pipefail
          PR="$"
          for i in 1 2 3 4; do
            if gh pr merge "$PR" --squash --delete-branch; then
              echo "Merged PR #$PR — article is going live."
              exit 0
            fi
            echo "Merge attempt $i for PR #$PR failed (mergeability may still be computing); retrying in 10s..."
            sleep 10
          done
          echo "::warning::Instant merge of PR #$PR did not complete; the hourly auto-merge backstop will publish it within the hour."
