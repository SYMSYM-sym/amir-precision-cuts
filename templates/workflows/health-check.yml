name: Weekly site health

# GENERATED by `npm run derive --only=workflows`.
on:
  schedule:
    - cron: '{{HEALTH_CRON}}'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Full live smoke test: every published article is live + rendered + has JSON-LD
      # Article schema; favicon/og.jpg return 200 (R4); feeds/sitemap/llms valid; and
      # sitemap == blog index == feed.xml == feed.json. Fails the job (RED) on any
      # broken article or count mismatch.
      - name: Install dependencies
        run: npm ci

      - name: Verify live site
        run: node scripts/verify-live.mjs

      # R5 layer 1: say something when it breaks. GitHub emails the actor on a
      # failed scheduled run, but only the actor -- this makes the failure
      # visible in the repo itself, where anyone looking will see it.
      - name: Open an issue if the site is unhealthy
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          existing="$(gh issue list --state open --label site-health --json number --jq 'length' 2>/dev/null || echo 0)"
          if [ "${existing:-0}" -eq 0 ]; then
            gh issue create \
              --title "Live site health check failed" \
              --label site-health \
              --body "\`npm run verify\` failed against {{site.domain}}.

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          This check exists because the expensive failures in this system are the
          SILENT ones -- an article in the sitemap that 404s, feeds drifting from
          the index, a build that half-ran. A page-by-page eyeball never catches
          those; a count comparison always does." || true
          fi

      # R5 layer 2: the dead-man's switch. This pings ONLY on success, so
      # "nothing ran at all" also alerts -- which the failure notification above
      # structurally cannot catch. The 8-day outage was invisible precisely
      # because nothing was failing; nothing was happening.
      - name: Heartbeat
        if: success() && env.HEARTBEAT_URL != ''
        env:
          HEARTBEAT_URL: ${{ secrets.HEARTBEAT_URL }}
        run: curl -fsS --retry 3 --max-time 10 "$HEARTBEAT_URL" > /dev/null
