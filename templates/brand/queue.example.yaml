# Topic queue — the editorial backlog. Published in order; queue[0] is next.
# Seed ~50, deduped at < 0.80 (R13), hyperlocal <= ~30%.
# `notes` is THE most important field: it's the article's reason to exist.

# --- GOOD: a distinct angle. This is what makes near-neighbor topics survive the
#     0.85 originality gate.
- slug: male-waxing-near-sunset-strip
  title: "Male Waxing Near the Sunset Strip: The Walk-In Option"
  target_keyword: male waxing near sunset strip
  secondary_keywords:
    - walkable men's waxing sunset strip
    - waxing near sunset strip hotels
  intent: MOF / commercial
  bucket: hyperlocal
  internal_links:
    - page: visit
    - service: chest
  notes: >-
    DISTINCT ANGLE — must NOT overlap the "drive in from [suburb]" hyperlocal articles.
    We sit half a block off the Strip: lead with WALKABILITY — guests at Strip hotels,
    people who work or perform nearby, appearance/on-camera prep before a shoot or stage
    night. Reference specific landmarks. Do NOT reuse "3-4 week cadence", "single-room
    suite", or "drive time" phrasing. Use 2-3 internal links. Target 1000-1300 words.

