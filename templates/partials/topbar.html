<div class="topbar">
  <div class="topbar__inner container">
    <span class="topbar__item"><span class="dot" aria-hidden="true"></span>{{derived.booking_line}}</span>
    <span class="topbar__spacer"></span>
    {{#if ?booking.publish_phone}}
    <a class="topbar__item" href="tel:{{booking.phone}}" aria-label="Call {{business.name}}">{{derived.phone_display}}</a>
    {{else}}
    {{#if ?booking.url}}<a class="topbar__item" href="{{booking.url}}">Book</a>{{/if}}
    {{/if}}
  </div>
</div>
