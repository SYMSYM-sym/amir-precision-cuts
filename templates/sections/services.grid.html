<section class="section {{SECTION_TONE}} section--services" id="services">
  <div class="container">
    <div class="section__head {{HEAD_ALIGN}}">
      <p class="eyebrow">Services</p>
      <h2 class="h2">Everything we offer</h2>
      <p class="section__sub">Walk in for any of these. Longer work is easier if you let us know you are coming.</p>
    </div>
    <div class="service-grid">
      {{#each services}}
      <article class="service-card" id="service-{{key}}">
        <div class="service-card__media" aria-hidden="true"><span class="service-card__initial">{{INITIAL}}</span></div>
        <div class="service-card__body">
          <h3 class="service-card__title h3">{{label}}</h3>
          <p class="service-card__desc">{{description}}</p>
          <p class="service-card__meta">
            {{#if ?price_from}}<span class="service-card__price">from {{price_display}}</span>{{/if}}
            {{#if ?duration}}<span class="service-card__duration">{{duration}}</span>{{/if}}
          </p>
        </div>
      </article>
      {{/each}}
    </div>
  </div>
</section>
